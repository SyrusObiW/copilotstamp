<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:#0f1020; color:#fff;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:24px 20px 40px; overflow-x:hidden;
  }
  .header { text-align:center; }
  .brand-logo { width:56px; height:56px; margin:0 auto 10px; display:block; }
  .header h1 { font-size:22px; font-weight:600; letter-spacing:.5px; }
  .header p { font-size:13px; color:#9a9ab5; margin-top:6px; }
  .progress { font-size:14px; color:#c9c9e0; margin:18px 0 8px; font-weight:500; }
  .progress b { color:#5DCAA5; font-size:18px; }
  .stage { position:relative; width:min(78vw,320px); aspect-ratio:1/1; margin:12px 0 20px; }
  .piece {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; transform:scale(.9) rotate(-8deg); transform-origin:center;
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,.85,.25,1);
  }
  .piece.on { opacity:1; transform:scale(1) rotate(0deg); }
  .dots { display:flex; gap:10px; margin:4px 0 18px; }
  .dot {
    width:34px; height:34px; border-radius:50%;
    border:1.5px solid #33344f; background:#1a1b2e;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#5a5a78; font-weight:600; transition:all .4s ease;
  }
  .dot.on { background:#5DCAA5; border-color:#5DCAA5; color:#0f1020; transform:scale(1.06); }
  .scan-btn {
    margin:6px 0 14px; padding:14px 28px; font-size:16px; font-weight:600;
    color:#fff; border:none; border-radius:30px; cursor:pointer;
    background:linear-gradient(90deg,#2AA5F0,#8A50D8,#EE5091,#FC7942);
    background-size:200% auto; box-shadow:0 6px 20px rgba(138,80,216,.35);
    display:flex; align-items:center; gap:8px; transition:transform .2s;
  }
  .scan-btn:active { transform:scale(.96); }
  .scan-btn svg { width:20px; height:20px; }
  .hint { font-size:13px; color:#8a8aa5; text-align:center; line-height:1.7; max-width:300px; margin-bottom:8px; }
  .done-banner { opacity:0; max-height:0; overflow:hidden; text-align:center; transition:opacity .6s ease, max-height .6s ease; }
  .done-banner.show { opacity:1; max-height:220px; margin-top:8px; }
  .done-banner .big { font-size:20px; font-weight:600; background:linear-gradient(90deg,#2AA5F0,#8A50D8,#EE5091,#FC7942); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .done-banner .sub { font-size:13px; color:#9a9ab5; margin-top:8px; line-height:1.6; }
  .rewards { width:min(88vw,340px); margin:14px 0 4px; display:flex; flex-direction:column; gap:10px; }
  .reward {
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    border-radius:14px; background:#1a1b2e; border:1.5px solid #2a2b42;
    opacity:.5; filter:grayscale(.6); transition:all .45s ease;
  }
  .reward.unlocked {
    opacity:1; filter:none;
    background:linear-gradient(135deg,rgba(42,165,240,.16),rgba(138,80,216,.16));
    border-color:#5DCAA5; box-shadow:0 4px 16px rgba(93,202,165,.18);
  }
  .reward-icon { font-size:26px; flex-shrink:0; }
  .reward-info { flex:1; text-align:left; }
  .reward-title { font-size:15px; font-weight:600; color:#fff; }
  .reward-cond { font-size:12px; color:#9a9ab5; margin-top:2px; }
  .reward-status { font-size:12px; font-weight:600; color:#6a6a85; flex-shrink:0; }
  .reward.unlocked .reward-status { color:#5DCAA5; }
  .reward-note { font-size:12px; color:#8a8aa5; text-align:center; line-height:1.6; margin-top:6px; }
  .reset { margin-top:22px; font-size:12px; color:#55566f; text-decoration:underline; background:none; border:none; cursor:pointer; }
  .confetti { position:fixed; top:-10px; width:9px; height:14px; opacity:0; z-index:50; border-radius:2px; }

  /* 掃描器全螢幕介面 */
  .scanner {
    position:fixed; inset:0; z-index:100; background:#000;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  .scanner.open { display:flex; }
  .scanner video { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
  .scan-frame {
    position:relative; width:66vw; max-width:280px; aspect-ratio:1/1;
    border:3px solid rgba(255,255,255,.9); border-radius:24px; z-index:2;
    box-shadow:0 0 0 100vmax rgba(0,0,0,.55);
  }
  .scan-frame::after {
    content:''; position:absolute; left:8%; right:8%; height:3px; top:10%;
    background:linear-gradient(90deg,transparent,#5DCAA5,transparent);
    animation:scanline 2s ease-in-out infinite;
  }
  @keyframes scanline { 0%,100%{top:10%} 50%{top:88%} }
  .scan-tip { position:absolute; bottom:14%; z-index:3; color:#fff; font-size:15px; text-align:center; width:80%; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  .scan-close {
    position:absolute; top:20px; right:20px; z-index:3;
    width:44px; height:44px; border-radius:50%; border:none;
    background:rgba(255,255,255,.2); color:#fff; font-size:24px; cursor:pointer;
  }
  .scan-err { position:absolute; z-index:3; color:#fff; background:rgba(0,0,0,.7); padding:20px; border-radius:12px; max-width:80%; text-align:center; font-size:14px; line-height:1.7; display:none; }
</style>

<script>
  var KEY = "copilot_tw_stamps_v1";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  function getParam(u){ var m = (u||location.search).match(/[?&]p=([1-5])/); return m ? m[1] : null; }

  var state = load();
  var p = getParam();
  var justUnlocked = null;
  if(p && !state[p]){ state[p] = true; save(state); justUnlocked = p; }

  function unlock(n, animate){
    if(!n) return false;
    var already = !!state[n];
    if(!already){ state[n]=true; save(state); }
    var piece = document.querySelector('.piece[data-p="'+n+'"]');
    var dot = document.querySelector('.dot[data-d="'+n+'"]');
    if(piece){ if(animate){ setTimeout(function(){piece.classList.add('on');},150);} else piece.classList.add('on'); }
    if(dot){ dot.classList.add('on'); dot.innerHTML='&#10003;'; }
    refreshCount();
    return !already;
  }

  var prevTiers = 0;
  function refreshCount(){
    var n=0; for(var i=1;i<=5;i++){ if(state[i]) n++; }
    document.getElementById('count').textContent = n;

    var tiers = (n>=1?1:0) + (n>=3?1:0) + (n>=5?1:0);
    setReward(1, n>=1);
    setReward(2, n>=3);
    setReward(3, n>=5);

    if(tiers > prevTiers){
      celebrate();
      var hint = document.getElementById('hint');
      if(n>=5){ hint.style.display='none'; }
      else if(n>=3){ hint.textContent = '已達 '+n+' 站，可領取第二份好禮！繼續集滿五站'; }
      else { hint.textContent = '已解鎖第一份好禮！繼續前往其他攤位'; }
    }
    prevTiers = tiers;

    if(n>=5){ document.getElementById('scanBtn').style.display='none'; }
  }

  function setReward(k, ok){
    var el = document.getElementById('reward'+k);
    var st = document.getElementById('rewardStatus'+k);
    if(!el) return;
    if(ok){ el.classList.add('unlocked'); st.textContent='可領取'; }
    else { el.classList.remove('unlocked'); st.textContent='未達成'; }
  }

  function render(){
    // baseline tier count from already-saved stamps (minus the one just unlocked this load),
    // so confetti only fires for genuinely new achievements, not on every reload
    var prior=0; for(var i=1;i<=5;i++){ if(state[i] && String(i)!==String(justUnlocked)) prior++; }
    prevTiers = (prior>=1?1:0) + (prior>=3?1:0) + (prior>=5?1:0);
    for(var i=1;i<=5;i++){ if(state[i]) unlock(i, i==justUnlocked); }
    if(justUnlocked){ document.getElementById('hint').textContent = '已解鎖第 '+justUnlocked+' 站！繼續前往其他攤位'; }
    else { refreshCount(); }
    var doneAll=true; for(var j=1;j<=5;j++){ if(!state[j]) doneAll=false; }
    if(doneAll){ document.getElementById('hint').style.display='none'; }

  function celebrate(){
    var colors=['#2AA5F0','#8A50D8','#EE5091','#FC7942','#99BD3C','#199FD7'];
    for(var i=0;i<44;i++){ (function(i){
      var c=document.createElement('div'); c.className='confetti';
      c.style.left=(Math.random()*100)+'vw'; c.style.background=colors[i%colors.length];
      document.body.appendChild(c);
      var dur=2200+Math.random()*1500, delay=Math.random()*500;
      setTimeout(function(){
        c.style.transition='transform '+dur+'ms linear, opacity '+dur+'ms linear';
        c.style.opacity='1';
        c.style.transform='translateY(110vh) rotate('+(360+Math.random()*720)+'deg)';
        setTimeout(function(){ c.remove(); }, dur+100);
      }, delay);
    })(i); }
  }

  document.getElementById('resetBtn').addEventListener('click', function(){

  });

        stream = s; video.srcObject = s; video.setAttribute('playsinline',true);
        return video.play();

        scanErr.innerHTML = '無法開啟相機。<br>請確認已允許相機權限，或改用手機內建相機直接掃描攤位 QR。<br><br>（' + (err && err.name ? err.name : '未知錯誤') + '）';
      });

</script>
