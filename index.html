<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Copilot Taiwan 集章活動</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:#0f1020; color:#fff;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:24px 20px 40px; overflow-x:hidden;
  }
  .header { text-align:center; }
  .header h1 { font-size:22px; font-weight:600; letter-spacing:.5px; }
  .header p { font-size:13px; color:#9a9ab5; margin-top:6px; }
  .progress { font-size:14px; color:#c9c9e0; margin:18px 0 8px; font-weight:500; }
  .progress b { color:#5DCAA5; font-size:18px; }
  .stage { position:relative; width:min(78vw,320px); aspect-ratio:1/1; margin:12px 0 20px; }
  .piece {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; transform:scale(.9) rotate(-8deg); transform-origin:center;
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,.85,.25,1);
  }
  .piece.on { opacity:1; transform:scale(1) rotate(0deg); }
  .dots { display:flex; gap:10px; margin:4px 0 22px; }
  .dot {
    width:34px; height:34px; border-radius:50%;
    border:1.5px solid #33344f; background:#1a1b2e;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#5a5a78; font-weight:600; transition:all .4s ease;
  }
  .dot.on { background:#5DCAA5; border-color:#5DCAA5; color:#0f1020; transform:scale(1.06); }
  .hint { font-size:13px; color:#8a8aa5; text-align:center; line-height:1.7; max-width:300px; margin-bottom:8px; }
  .done-banner { opacity:0; max-height:0; overflow:hidden; text-align:center; transition:opacity .6s ease, max-height .6s ease; }
  .done-banner.show { opacity:1; max-height:220px; margin-top:8px; }
  .done-banner .big { font-size:20px; font-weight:600; background:linear-gradient(90deg,#2AA5F0,#8A50D8,#EE5091,#FC7942); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .done-banner .sub { font-size:13px; color:#9a9ab5; margin-top:8px; line-height:1.6; }
  .reset { margin-top:26px; font-size:12px; color:#55566f; text-decoration:underline; background:none; border:none; cursor:pointer; }
  .confetti { position:fixed; top:-10px; width:9px; height:14px; opacity:0; z-index:50; border-radius:2px; }
</style>
</head>

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  function getParam(){ var m = location.search.match(/[?&]p=([1-5])/); return m ? m[1] : null; }

  var state = load();
  var p = getParam();
  var justUnlocked = null;
  if(p && !state[p]){ state[p] = true; save(state); justUnlocked = p; }

  function render(){
    var n = 0;
    for(var i=1;i<=5;i++){
      var on = !!state[i];
      if(on) n++;
      var piece = document.querySelector('.piece[data-p="'+i+'"]');
      var dot = document.querySelector('.dot[data-d="'+i+'"]');
      if(on){
        if(i==justUnlocked){ setTimeout((function(pc){return function(){pc.classList.add('on');};})(piece), 150); }
        else piece.classList.add('on');
        dot.classList.add('on'); dot.innerHTML='&#10003;';
      }
    }
    document.getElementById('count').textContent = n;
    if(justUnlocked){ document.getElementById('hint').textContent = '已解鎖第 '+justUnlocked+' 站！繼續前往其他攤位'; }
    if(n>=5){
      setTimeout(function(){
        document.getElementById('doneBanner').classList.add('show');
        document.getElementById('hint').style.display='none';
        celebrate();
      }, justUnlocked ? 900 : 300);
    }
  }

  function celebrate(){
    var colors=['#2AA5F0','#8A50D8','#EE5091','#FC7942','#99BD3C','#199FD7'];
    for(var i=0;i<44;i++){
      (function(i){
        var c=document.createElement('div');
        c.className='confetti';
        c.style.left=(Math.random()*100)+'vw';
        c.style.background=colors[i%colors.length];
        document.body.appendChild(c);
        var dur=2200+Math.random()*1500, delay=Math.random()*500;
        setTimeout(function(){
          c.style.transition='transform '+dur+'ms linear, opacity '+dur+'ms linear';
          c.style.opacity='1';
          c.style.transform='translateY(110vh) rotate('+(360+Math.random()*720)+'deg)';
          setTimeout(function(){ c.remove(); }, dur+100);
        }, delay);
      })(i);
    }
  }

  document.getElementById('resetBtn').addEventListener('click', function(){
    if(confirm('確定要重設所有進度嗎？')){ localStorage.removeItem(KEY); location.href = location.pathname; }
  });

  render();
</script>
</body>
</html>
